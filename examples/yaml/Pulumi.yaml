name: provider-pve
runtime: yaml
plugins:
  providers:
    - name: pve
      path: ../../bin

variables:
  zone:
    name: test
    vxlanPort: 4784
    ipam: pve
    fabric: zerotest
    nodes:
      - stage-devops-proxmox02
      - stage-devops-proxmox01
    

resources:
  myVnet:
    type: pve:sdn:Vnet
    properties:
      vnet: test     # max 8 alphanumeric chars, must start with a letter
      zone: ztonvl        # must reference an existing SDN zone
      tag: 10099          # VNI/VLAN tag (1-16777215)
      alias: "my vnet"    # optional
      vlanaware: false    # optional; allow guest VLANs to trunk through
      isolatePorts: false # optional; isolate all bridge interfaces
  
  myZone:
    type: pve:sdn/zone:VxlanZone
    properties: ${zone}
  
  mySDNApply:
    type: pve:sdn:Apply
    properties:
      triggers:
        zone: ${zone}
        vnetTag: ${myVnet.tag}
    options:
      dependsOn:
        - ${myVnet}
        - ${myZone}

  myFile:
    type: pve:file:File
    properties:
      datastoreId: cephfs
      contentType: snippets
      sourceRaw:
        fileData: |
          hello world
        fileName: testfile011.yaml

  myPool:
    type: pve:pool:Pool
    properties:
      name: testpool
      comment: "a test pool"
      storage:
        - cephfs
      vms:
        - 100

  myVM:
    type: pve:vm:VM
    properties:
      name: "aTestVM"
      description: "flags + bandwidth integration test"
      node: "stage-devops-proxmox01"
      vmId: 119
      memory: 2048
      disks:
        disk-0:
          storage: "ceph-ha"
          size: 17
          interface: "scsi0"
          cache: "none"
          iothread: true
          bandwidth:
            mbpsRd: 200.0
            mbpsWr: 100.0
            mbpsRdMax: 400.0
        disk-1:
          storage: "ceph-ha"
          size: 17
          interface: "scsi1"
          bandwidth:
            iopsRd: 2000
            iopsWr: 1000
            iopsRdMax: 4000
        disk-2:
          storage: "ceph-ha"
          size: 10
          interface: "sata0"
      clone:
        vmId: 102
        timeout: 360
        fullClone: true
